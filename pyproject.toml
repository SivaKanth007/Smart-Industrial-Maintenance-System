[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-industrial-maintenance"
version = "1.0.0"
description = "End-to-end AI system for industrial anomaly detection, failure prediction, and maintenance scheduling"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "FSE 570 Capstone Team"},
]
dependencies = [
    "torch>=2.0.0",
    "xgboost>=1.7.0",
    "scikit-learn>=1.2.0",
    "lifelines>=0.27.0",
    "scipy>=1.10.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "plotly>=5.10.0",
    "shap>=0.41.0",
    "PuLP>=2.7.0",
    "streamlit>=1.25.0",
    "joblib>=1.2.0",
    "tqdm>=4.64.0",
    "kagglehub>=0.3.0",
    "kaggle>=1.5.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
test = ["pytest>=7.2.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools]
py-modules = ["config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
